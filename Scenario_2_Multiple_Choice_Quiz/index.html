<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Multiple-Choice Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="quiz-card">
    <header>
      <p class="eyebrow">TEST YOUR KNOWLEDGE</p>
      <h1>JavaScript Quiz</h1>
    </header>

    <section id="question-screen">
      <div class="progress-line">
        <span id="question-count">Question 1 of 4</span>
        <span id="progress-percent">25%</span>
      </div>
      <div class="progress-track"><div id="progress-fill"></div></div>

      <h2 id="question-text"></h2>
      <form id="options-form">
        <div id="options-container" class="options"></div>
        <p id="selection-message" class="selection-message" aria-live="polite">Select one option to continue.</p>
        <button id="next-button" class="primary-btn" type="button" disabled>Next</button>
      </form>
    </section>

    <section id="result-screen" class="result-screen" hidden aria-live="polite">
      <p class="eyebrow">QUIZ COMPLETED</p>
      <div id="score" class="score">3 / 4</div>
      <p id="percentage" class="percentage">You scored 75%.</p>
      <h2 id="result-message">Good job!</h2>
      <button id="restart-button" class="primary-btn" type="button">Restart Quiz</button>
    </section>
  </main>
</body>
</html>
